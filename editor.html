<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CaseDisplay</title>
<style>
  :root { --bg:#0f1117; --panel:#171a22; --line:#2a2f3a; --text:#e6e8ee; --dim:#9aa3b2; --accent:#3fb6ff; --danger:#ff5a5a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 "Segoe UI","Malgun Gothic",sans-serif; }
  header { display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  .sep { width:1px; height:24px; background:var(--line); margin:0 4px; }
  button, .btn { background:#232836; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer; font:inherit; }
  button:hover, .btn:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#001220; border-color:var(--accent); font-weight:600; }
  button.danger { color:var(--danger); }
  button:disabled { opacity:.4; cursor:default; border-color:var(--line); }
  #status { margin-left:auto; color:var(--dim); font-size:13px; }
  main { display:grid; grid-template-columns: minmax(0,1fr) 360px; gap:16px; padding:16px; }
  @media (max-width: 1050px) { main { grid-template-columns: 1fr; } }
  .stage-wrap { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; align-self:start; }
  #stage { position:relative; width:100%; aspect-ratio: 2 / 1; background:#000; overflow:hidden; border-radius:4px; user-select:none; touch-action:none; }
  #stage img { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .box { position:absolute; border:1px dashed rgba(255,255,255,.35); cursor:move; touch-action:none; }
  .box:hover { border-color: rgba(63,182,255,.9); }
  .box.sel { border:2px solid var(--accent); background:rgba(63,182,255,.12); }
  .hint { color:var(--dim); font-size:12px; margin-top:8px; }
  aside { display:flex; flex-direction:column; gap:12px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  section h2 { font-size:13px; margin:0 0 10px; color:var(--dim); font-weight:600; }
  h3.grp { font-size:11px; color:var(--accent); margin:12px 0 4px; font-weight:600; letter-spacing:.03em; border-top:1px solid var(--line); padding-top:8px; }
  h3.grp:first-child { border-top:none; margin-top:0; padding-top:0; }
  .row { display:grid; grid-template-columns: 124px 1fr; align-items:center; gap:8px; margin:5px 0; }
  .row label { color:var(--dim); font-size:12px; }
  input[type=text], input[type=number], select { width:100%; background:#0f1219; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:5px 6px; font:inherit; }
  input[type=range] { width:100%; }
  .color { display:grid; grid-template-columns: 44px 1fr 38px; gap:6px; align-items:center; }
  .color input[type=color] { width:44px; height:28px; padding:0; border:1px solid var(--line); background:none; }
  #wlist { max-height:200px; overflow:auto; display:flex; flex-direction:column; gap:4px; }
  .witem { display:flex; align-items:center; gap:6px; padding:5px 6px; border-radius:5px; cursor:pointer; border:1px solid transparent; }
  .witem:hover { background:#1e2330; }
  .witem.sel { border-color:var(--accent); background:#152233; }
  .witem .t { font-size:11px; color:var(--dim); width:40px; }
  .witem .n { flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .witem .ord { padding:0 6px; font-size:11px; }
  .empty { color:var(--dim); font-size:12px; }
  #fileBg { display:none; }
  .rec-tabs { display:flex; gap:4px; margin:10px 0 6px; }
  .tab { flex:1; font-size:12px; padding:4px 6px; }
  .tab.on { border-color:var(--accent); color:var(--accent); }
  #reclist { max-height:180px; overflow:auto; display:flex; flex-direction:column; gap:4px; }
  .rec { display:grid; grid-template-columns: 1fr auto auto; gap:4px; align-items:center; padding:4px 6px; border-radius:5px; background:#12151d; }
  .rec .nm { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .rec .tm { font-size:11px; color:var(--dim); }
  .rec button { padding:2px 7px; font-size:12px; }
  .ranges { display:flex; flex-direction:column; gap:4px; }
  .rangerow { display:grid; grid-template-columns: 70px 1fr 28px; gap:6px; align-items:center; }
  .rangerow button { padding:2px 6px; }

  #cropDlg { position:fixed; inset:0; background:rgba(0,0,0,.75); display:none; align-items:center; justify-content:center; z-index:10; }
  #cropDlg.open { display:flex; }
  .crop-panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; width:min(1100px, 94vw); }
  .crop-panel h3 { margin:0 0 8px; font-size:15px; }
  #cropArea { position:relative; margin:0 auto; background:#000; user-select:none; touch-action:none; overflow:hidden; }
  #cropImg { position:absolute; left:0; top:0; pointer-events:none; }
  #cropRect { position:absolute; border:2px solid var(--accent); box-shadow:0 0 0 9999px rgba(0,0,0,.55); cursor:move; touch-action:none; }
  .handle { position:absolute; width:16px; height:16px; background:var(--accent); border-radius:3px; touch-action:none; }
  .handle.nw { left:-8px; top:-8px; cursor:nwse-resize; } .handle.ne { right:-8px; top:-8px; cursor:nesw-resize; }
  .handle.sw { left:-8px; bottom:-8px; cursor:nesw-resize; } .handle.se { right:-8px; bottom:-8px; cursor:nwse-resize; }
  .crop-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:10px; align-items:center; }
  .crop-actions .info { margin-right:auto; color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>한새는 천재다</h1>
  <button id="undo" title="되돌리기 (Ctrl+Z)">↶ 되돌리기</button>
  <button id="redo" title="다시 실행 (Ctrl+Y)">↷ 다시 실행</button>
  <span class="sep"></span>
  <button data-add="text">+ 글자</button>
  <button data-add="value">+ 센서 값</button>
  <button data-add="bar">+ 막대</button>
  <button data-add="ring">+ 원형 링</button>
  <button data-add="gauge">+ 속도계</button>
  <button data-add="graph">+ 그래프</button>
  <span class="sep"></span>
  <label class="btn" for="fileBg">배경 이미지 변경</label><input type="file" id="fileBg" accept="image/*">
  <button id="reload">다시 불러오기</button>
  <button id="save" class="primary">저장 (케이스 화면 적용)</button>
  <span id="status">불러오는 중…</span>
</header>
<main>
  <div class="stage-wrap">
    <div id="stage"><img id="preview" alt=""></div>
    <div class="hint">위젯을 마우스로 끌어서 옮기세요. 선택 후 방향키 = 1px 이동 (Shift = 10px), Delete = 삭제, Ctrl+Z / Ctrl+Y = 되돌리기 / 다시 실행. 겹친 위젯은 오른쪽 목록에서 선택하세요.</div>
  </div>
  <aside>
    <section>
      <h2>케이스 화면</h2>
      <div class="row"><label>밝기 <span id="bVal"></span></label><input type="range" id="brightness" min="0" max="100"></div>
      <div class="row"><label>회전</label><select id="rotate"><option>0</option><option>90</option><option>180</option><option>270</option></select></div>
      <div class="row"><label>갱신 주기(초)</label><input type="number" id="interval" min="0.5" step="0.5"></div>
      <div class="row"><label>잠금 시 끄기</label><input type="checkbox" id="offLocked"></div>
      <div class="row"><label>모니터 절전 시 끄기</label><input type="checkbox" id="offDisplay"></div>
    </section>
    <section>
      <h2>설정 기록</h2>
      <div style="display:grid;grid-template-columns:1fr auto;gap:6px">
        <input type="text" id="recName" placeholder="기록 이름 (예: 게임용, 밤 모드)">
        <button id="recSave">현재 설정 기록</button>
      </div>
      <div class="rec-tabs">
        <button id="tabPresets" class="tab on">이름 붙인 기록</button>
        <button id="tabHistory" class="tab">자동 기록 (저장할 때마다)</button>
      </div>
      <div id="reclist"></div>
    </section>
    <section>
      <h2>위젯 (아래쪽일수록 위에 그려짐)</h2>
      <div id="wlist"></div>
    </section>
    <section>
      <h2>선택한 위젯</h2>
      <div id="props"><div class="empty">위젯을 선택하세요</div></div>
    </section>
  </aside>
</main>

<div id="cropDlg">
  <div class="crop-panel">
    <h3>배경 자르기 (케이스 화면 비율 2:1, 960×480)</h3>
    <div id="cropArea"><img id="cropImg" alt=""><div id="cropRect">
      <div class="handle nw" data-h="nw"></div><div class="handle ne" data-h="ne"></div>
      <div class="handle sw" data-h="sw"></div><div class="handle se" data-h="se"></div></div></div>
    <div class="crop-actions">
      <span class="info" id="cropInfo"></span>
      <button id="cropFit">최대 크기</button>
      <button id="cropCancel">취소</button>
      <button id="cropApply" class="primary">적용</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const TYPE_NAMES = { text: "글자", value: "값", bar: "막대", ring: "링", gauge: "속도계", graph: "그래프" };
let S = null, sel = null, boxes = [], dirty = false, drag = null;
let renderTimer = null, rendering = false, renderAgain = false;
const status = t => $("#status").textContent = t;
const widgets = () => S.theme.widgets;
const byId = id => widgets().find(w => w.id === id);
const clone = o => JSON.parse(JSON.stringify(o));

// ---------- path helpers ("font.size") ----------
function getP(o, path) { return path.split(".").reduce((a, k) => (a == null ? undefined : a[k]), o); }
function setP(o, path, v) { const ks = path.split("."); let a = o; for (const k of ks.slice(0, -1)) { if (a[k] == null || typeof a[k] !== "object") a[k] = {}; a = a[k]; } a[ks[ks.length - 1]] = v; }

// ---------- undo / redo ----------
const HIST = { undo: [], redo: [], max: 200 };
let lastEdit = { key: null, t: 0 };
const snapshot = () => JSON.stringify(S.theme);
function updHistBtns() { $("#undo").disabled = !HIST.undo.length; $("#redo").disabled = !HIST.redo.length; }
function pushHistory() { HIST.undo.push(snapshot()); if (HIST.undo.length > HIST.max) HIST.undo.shift(); HIST.redo.length = 0; updHistBtns(); }
function beginEdit(key) { const now = Date.now(); if (key !== lastEdit.key || now - lastEdit.t > 1200) pushHistory(); lastEdit = { key, t: now }; }
function applySnapshot(json) { S.theme = JSON.parse(json); if (sel && !byId(sel)) sel = null; lastEdit = { key: null, t: 0 }; markDirty(); renderList(); renderProps(); scheduleRender(10); updHistBtns(); }
function undo() { if (!HIST.undo.length) return; HIST.redo.push(snapshot()); applySnapshot(HIST.undo.pop()); status("되돌림"); }
function redo() { if (!HIST.redo.length) return; HIST.undo.push(snapshot()); applySnapshot(HIST.redo.pop()); status("다시 실행"); }

// ---------- colors ----------
function toRgba(s) {
  s = (s || "").trim(); const m = s.match(/rgba?\(([^)]+)\)/);
  if (m) { const p = m[1].split(",").map(parseFloat); return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1]; }
  if (s[0] === "#") { let h = s.slice(1); if (h.length === 3) h = [...h].map(c => c + c).join("");
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16), h.length >= 8 ? parseInt(h.slice(6,8),16)/255 : 1]; }
  return [255, 255, 255, 1];
}
const hex2 = n => Math.round(n).toString(16).padStart(2, "0");

// ---------- load / render ----------
async function load() {
  const r = await fetch("/api/state"); S = await r.json();
  if (S.error) { status("오류: " + S.error); return; }
  S.theme.widgets = S.theme.widgets || [];
  S.theme.widgets.forEach((w, i) => { if (w.id == null || w.id === "") w.id = "w" + i + "_" + Date.now(); });
  const c = S.config;
  $("#brightness").value = c.brightness ?? 21; $("#bVal").textContent = $("#brightness").value;
  $("#rotate").value = String(c.rotate ?? 270);
  $("#interval").value = c.interval_seconds ?? 2;
  $("#offLocked").checked = c.off_when_locked !== false;
  $("#offDisplay").checked = c.off_when_display_off !== false;
  sel = null; dirty = false; HIST.undo.length = 0; HIST.redo.length = 0; lastEdit = { key: null, t: 0 }; updHistBtns();
  renderList(); renderProps(); await render(); loadRecords();
  status("불러옴");
}
function previewScale() {
  const px = $("#stage").clientWidth * (window.devicePixelRatio || 1);
  return px > 1200 ? 2 : (px > 1000 ? 1.5 : 1);
}
function scheduleRender(delay = 250) { clearTimeout(renderTimer); renderTimer = setTimeout(render, delay); }
async function render() {
  if (rendering) { renderAgain = true; return; }
  rendering = true;
  try {
    const r = await fetch("/api/render", { method: "POST", body: JSON.stringify({ theme: S.theme, scale: previewScale() }) });
    const j = await r.json();
    if (j.error) { status("미리보기 오류: " + j.error); return; }
    $("#preview").src = j.image; boxes = j.boxes;
    if (!drag) drawBoxes();
  } catch (e) { status("미리보기 실패: " + e); }
  finally { rendering = false; if (renderAgain) { renderAgain = false; scheduleRender(50); } }
}
function drawBoxes() {
  const st = $("#stage"); st.querySelectorAll(".box").forEach(b => b.remove());
  const k = st.clientWidth / 960;
  for (const b of boxes) {
    const d = document.createElement("div");
    d.className = "box" + (b.id === sel ? " sel" : "");
    Object.assign(d.style, { left: b.x * k + "px", top: b.y * k + "px", width: Math.max(8, b.w * k) + "px", height: Math.max(8, b.h * k) + "px" });
    d.dataset.id = b.id; d.addEventListener("pointerdown", startDrag); st.appendChild(d);
  }
}
const markSelectedBoxes = () => document.querySelectorAll("#stage .box").forEach(b => b.classList.toggle("sel", b.dataset.id === sel));
function markDirty() { dirty = true; status("저장 안 됨"); }

// ---------- drag ----------
function startDrag(e) {
  if (e.button !== 0) return;
  const el = e.currentTarget, id = el.dataset.id, w = byId(id); if (!w) return;
  sel = id; markSelectedBoxes(); renderList(); renderProps();
  drag = { id, el, sx: e.clientX, sy: e.clientY, ox: +w.x || 0, oy: +w.y || 0, left: parseFloat(el.style.left), top: parseFloat(el.style.top), moved: false };
  window.addEventListener("pointermove", onDrag); window.addEventListener("pointerup", endDrag, { once: true });
  e.preventDefault();
}
function onDrag(e) {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 2) return;
  if (!drag.moved) pushHistory();
  drag.moved = true;
  const u = 960 / $("#stage").clientWidth, w = byId(drag.id);
  w.x = Math.round(drag.ox + dx * u); w.y = Math.round(drag.oy + dy * u);
  drag.el.style.left = drag.left + dx + "px"; drag.el.style.top = drag.top + dy + "px";
  markDirty(); scheduleRender(150);
}
function endDrag() {
  window.removeEventListener("pointermove", onDrag);
  const moved = drag && drag.moved; drag = null;
  if (moved) { renderProps(); scheduleRender(10); } else drawBoxes();
}

// ---------- widget list ----------
function label(w) {
  if (w.type === "text") return w.content || "(빈 글자)";
  const src = S.sources.find(s => s.id === w.source);
  return (w.label ? w.label + " · " : "") + ((src ? src.label : w.source) || "(센서 없음)");
}
function renderList() {
  const el = $("#wlist"); el.innerHTML = "";
  if (!widgets().length) { el.innerHTML = '<div class="empty">위젯이 없습니다</div>'; return; }
  widgets().forEach((w, i) => {
    const d = document.createElement("div"); d.className = "witem" + (w.id === sel ? " sel" : "");
    d.innerHTML = `<span class="t">${TYPE_NAMES[w.type] || w.type}</span><span class="n"></span>`;
    d.querySelector(".n").textContent = label(w);
    const up = document.createElement("button"); up.className = "ord"; up.textContent = "▲"; up.title = "아래로 보내기";
    const dn = document.createElement("button"); dn.className = "ord"; dn.textContent = "▼"; dn.title = "위로 올리기";
    up.onclick = (e) => { e.stopPropagation(); move(i, -1); }; dn.onclick = (e) => { e.stopPropagation(); move(i, 1); };
    d.append(up, dn); d.onclick = () => select(w.id); el.appendChild(d);
  });
}
function move(i, dir) {
  const j = i + dir, ws = widgets(); if (j < 0 || j >= ws.length) return;
  pushHistory(); [ws[i], ws[j]] = [ws[j], ws[i]]; markDirty(); renderList(); scheduleRender(10);
}
function select(id) { sel = id; renderList(); renderProps(); markSelectedBoxes(); }

// ---------- property editors ----------
function row(labelText, input) { const r = document.createElement("div"); r.className = "row"; const l = document.createElement("label"); l.textContent = labelText; r.append(l, input); return r; }
function grp(t) { const h = document.createElement("h3"); h.className = "grp"; h.textContent = t; return h; }
function numI(w, path, step = 1, allowEmpty = false) {
  const i = document.createElement("input"); i.type = "number"; i.step = step;
  const v = getP(w, path); i.value = v == null ? "" : v; if (allowEmpty) i.placeholder = "자동";
  i.oninput = () => { beginEdit(sel + path); setP(w, path, i.value === "" && allowEmpty ? null : (parseFloat(i.value) || 0)); markDirty(); scheduleRender(); };
  return i;
}
function textI(w, path) {
  const i = document.createElement("input"); i.type = "text"; i.value = getP(w, path) ?? "";
  i.oninput = () => { beginEdit(sel + path); setP(w, path, i.value); markDirty(); renderList(); scheduleRender(); };
  return i;
}
function selI(w, path, options, after) {
  const s = document.createElement("select");
  for (const o of options) { const op = document.createElement("option"); op.value = o.value; op.textContent = o.label; s.appendChild(op); }
  const v = getP(w, path) ?? ""; s.value = v;
  if (v && s.value !== String(v)) { const op = document.createElement("option"); op.value = op.textContent = v; s.appendChild(op); s.value = v; }
  s.onchange = () => { pushHistory(); setP(w, path, s.value); markDirty(); if (after) after(); scheduleRender(); };
  return s;
}
function chkI(w, path, dflt = false, after) {
  const i = document.createElement("input"); i.type = "checkbox"; const v = getP(w, path); i.checked = v == null ? dflt : !!v;
  i.onchange = () => { pushHistory(); setP(w, path, i.checked); markDirty(); if (after) after(); scheduleRender(); };
  return i;
}
function colI(w, path, dflt = "rgba(255, 255, 255, 1)") {
  const wrap = document.createElement("div"); wrap.className = "color";
  const c = document.createElement("input"); c.type = "color";
  const a = document.createElement("input"); a.type = "range"; a.min = 0; a.max = 1; a.step = 0.01;
  const t = document.createElement("span"); t.style.fontSize = "11px"; t.style.color = "var(--dim)";
  const [r, g, b, al] = toRgba(getP(w, path) || dflt); c.value = "#" + hex2(r) + hex2(g) + hex2(b); a.value = al; t.textContent = Math.round(al * 100) + "%";
  const upd = () => { beginEdit(sel + path); const h = c.value;
    setP(w, path, `rgba(${parseInt(h.slice(1,3),16)}, ${parseInt(h.slice(3,5),16)}, ${parseInt(h.slice(5,7),16)}, ${a.value})`);
    t.textContent = Math.round(a.value * 100) + "%"; markDirty(); scheduleRender(); };
  c.oninput = upd; a.oninput = upd; wrap.append(c, a, t); return wrap;
}
function rangesI(w) {
  const box = document.createElement("div"); box.className = "ranges";
  const redraw = () => {
    box.innerHTML = "";
    (w.colorRanges || []).forEach((r, i) => {
      const rr = document.createElement("div"); rr.className = "rangerow";
      const n = document.createElement("input"); n.type = "number"; n.value = r.from ?? 0; n.title = "이 값 이상이면";
      n.oninput = () => { beginEdit(sel + "range" + i); r.from = parseFloat(n.value) || 0; markDirty(); scheduleRender(); };
      const col = colI(r, "color", "rgba(255, 90, 90, 1)");
      const del = document.createElement("button"); del.textContent = "✕"; del.className = "danger";
      del.onclick = () => { pushHistory(); w.colorRanges.splice(i, 1); markDirty(); redraw(); scheduleRender(); };
      rr.append(n, col, del); box.appendChild(rr);
    });
    const add = document.createElement("button"); add.textContent = "+ 구간 추가 (이 값 이상이면 색 변경)";
    add.onclick = () => { pushHistory(); (w.colorRanges = w.colorRanges || []).push({ from: 80, color: "rgba(255, 90, 90, 1)" }); markDirty(); redraw(); scheduleRender(); };
    box.appendChild(add);
  };
  redraw(); return box;
}

function renderProps() {
  const el = $("#props"); el.innerHTML = "";
  const w = sel && byId(sel);
  if (!w) { el.innerHTML = '<div class="empty">위젯을 선택하세요</div>'; return; }
  const fontOpts = S.fonts.map(f => ({ value: f, label: f }));
  const srcOpts = S.sources.map(s => ({ value: s.id, label: s.label }));
  const t = w.type;
  const fontRows = (key, label) => [row(label + " 글꼴", selI(w, key + ".family", fontOpts)), row(label + " 크기", numI(w, key + ".size", 0.5)), row(label + " 굵게", chkI(w, key + ".bold"))];

  el.append(grp("위치 · 크기"), row("X", numI(w, "x")), row("Y", numI(w, "y")));
  if (["bar", "graph"].includes(t)) el.append(row("너비", numI(w, "w")), row("높이", numI(w, "h")));
  if (["ring", "gauge"].includes(t)) el.append(row("지름", numI(w, "size")), row("두께", numI(w, "thickness")));

  if (t === "text") el.append(grp("내용"), row("글자", textI(w, "content")));
  if (t !== "text") {
    el.append(grp("센서"), row("센서", selI(w, "source", srcOpts, renderList)));
    if (t !== "value") el.append(row("최솟값", numI(w, "min", 1, t === "graph")), row("최댓값", numI(w, "max", 1, t === "graph")));
    if (t === "graph") el.append(row("표시 시간(초)", numI(w, "seconds", 10)));
  }

  if (t === "bar") el.append(grp("막대 모양"), row("배경색", colI(w, "bg")), row("시작 색", colI(w, "colorStart")), row("끝 색", colI(w, "colorEnd")),
    row("칸 수 (0=연속)", numI(w, "segments")), row("칸 간격", numI(w, "gap", 0.5)), row("모서리 둥글기", numI(w, "radius", 0.5)));
  if (t === "ring") el.append(grp("링 모양"), row("배경색", colI(w, "bg")), row("시작 색", colI(w, "colorStart")), row("끝 색", colI(w, "colorEnd")),
    row("시작 각도", numI(w, "startAngle", 5)), row("범위 각도", numI(w, "sweep", 5)), row("둥근 끝", chkI(w, "roundCap", true)));
  if (t === "gauge") el.append(grp("속도계 모양"), row("배경색", colI(w, "bg")), row("시작 색", colI(w, "colorStart")), row("끝 색", colI(w, "colorEnd")),
    row("눈금 수", numI(w, "ticks")), row("눈금 색", colI(w, "tickColor")), row("바늘 색", colI(w, "needleColor")));
  if (t === "graph") el.append(grp("그래프 모양"), row("형태", selI(w, "style", [{ value: "area", label: "면" }, { value: "line", label: "선" }])),
    row("선 색", colI(w, "lineColor")), row("채움 색", colI(w, "fillColor")), row("선 두께", numI(w, "lineWidth", 0.5)),
    row("격자", chkI(w, "grid", true)), row("격자 색", colI(w, "gridColor")));

  if (["text", "value"].includes(t)) el.append(grp("글자"), ...fontRows("font", ""), row("색", colI(w, "color")));
  if (["value", "ring", "gauge"].includes(t)) {
    if (t !== "value") el.append(grp("가운데 값"), row("값 표시", chkI(w, "showValue", true)), ...fontRows("font", "값"), row("값 색", colI(w, "color")));
    el.append(row("소수점 자리", numI(w, "decimals")), row("단위 표시", chkI(w, "unit", true)));
    el.append(grp("구간별 색 (값에 따라 글자색 변경)"), rangesI(w));
  }
  if (["ring", "gauge"].includes(t)) el.append(grp("아래 이름"), row("이름", textI(w, "label")), ...fontRows("labelFont", "이름"), row("이름 색", colI(w, "labelColor")));

  el.append(grp("카드 배경"), row("사용", chkI(w, "card.enabled", false, renderProps)));
  if (w.card && w.card.enabled) el.append(row("색", colI(w, "card.color", "rgba(0, 0, 0, 0.4)")), row("둥글기", numI(w, "card.radius")), row("여백", numI(w, "card.padding")));

  const del = document.createElement("button"); del.className = "danger"; del.textContent = "이 위젯 삭제"; del.style.marginTop = "12px";
  del.onclick = removeSel; el.append(del);
}

// ---------- add / delete ----------
const FONT = (size, bold = true) => ({ family: "Agency FB", size, bold });
const TEMPLATES = {
  text:  { content: "TEXT", font: FONT(22, false), color: "rgba(255, 255, 255, 1)" },
  value: { source: "CPU Temperature", decimals: 0, unit: true, font: FONT(32), color: "rgba(255, 255, 255, 1)", colorRanges: [] },
  bar:   { source: "CPU Usage", w: 200, h: 24, min: 0, max: 100, bg: "rgba(255, 255, 255, 0.18)", colorStart: "rgba(19, 187, 206, 1)", colorEnd: "rgba(206, 19, 19, 1)", segments: 0, gap: 3, radius: 4 },
  ring:  { source: "CPU Temperature", size: 150, thickness: 14, min: 20, max: 95, startAngle: 135, sweep: 270, roundCap: true, bg: "rgba(255, 255, 255, 0.18)",
           colorStart: "rgba(19, 187, 206, 1)", colorEnd: "rgba(255, 60, 60, 1)", showValue: true, decimals: 0, unit: true, font: FONT(40), color: "rgba(255, 255, 255, 1)",
           label: "CPU", labelFont: FONT(18, false), labelColor: "rgba(180, 220, 255, 1)", colorRanges: [] },
  gauge: { source: "GPU Power", size: 200, thickness: 14, min: 0, max: 300, ticks: 10, tickColor: "rgba(255, 255, 255, 0.6)", needleColor: "rgba(255, 255, 255, 0.9)",
           bg: "rgba(255, 255, 255, 0.18)", colorStart: "rgba(19, 187, 206, 1)", colorEnd: "rgba(255, 60, 60, 1)", showValue: true, decimals: 0, unit: true,
           font: FONT(30), color: "rgba(255, 255, 255, 1)", label: "GPU POWER", labelFont: FONT(14, false), labelColor: "rgba(200, 200, 200, 1)", colorRanges: [] },
  graph: { source: "CPU Usage", w: 360, h: 120, seconds: 120, min: 0, max: 100, style: "area", lineColor: "rgba(63, 182, 255, 1)", fillColor: "rgba(63, 182, 255, 0.3)",
           lineWidth: 2, grid: true, gridColor: "rgba(255, 255, 255, 0.14)", card: { enabled: true, color: "rgba(0, 0, 0, 0.35)", radius: 12, padding: 8 } },
};
function newWidget(type) {
  const w = Object.assign({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()), type, x: 40, y: 40 }, clone(TEMPLATES[type]));
  pushHistory(); widgets().push(w); sel = w.id; markDirty(); renderList(); renderProps(); scheduleRender(10);
}
function removeSel() {
  if (!sel) return;
  pushHistory(); S.theme.widgets = widgets().filter(w => w.id !== sel);
  sel = null; markDirty(); renderList(); renderProps(); scheduleRender(10);
}

// ---------- save ----------
const currentConfig = () => ({ brightness: +$("#brightness").value, rotate: +$("#rotate").value, interval_seconds: +$("#interval").value,
                               off_when_locked: $("#offLocked").checked, off_when_display_off: $("#offDisplay").checked });
async function save() {
  status("저장 중…");
  const r = await fetch("/api/save", { method: "POST", body: JSON.stringify({ config: currentConfig(), theme: S.theme }) });
  const j = await r.json();
  if (j.ok) { dirty = false; status("저장됨 — 케이스 화면에 곧 반영됩니다"); if (recKind === "history") loadRecords(); } else status("저장 실패: " + (j.error || r.status));
}

// ---------- records ----------
let recKind = "presets";
async function loadRecords() {
  const j = await (await fetch("/api/records")).json();
  const list = j[recKind] || [], el = $("#reclist"); el.innerHTML = "";
  $("#tabPresets").classList.toggle("on", recKind === "presets"); $("#tabHistory").classList.toggle("on", recKind === "history");
  if (!list.length) { el.innerHTML = `<div class="empty">${recKind === "presets" ? "기록이 없습니다. 이름을 입력하고 '현재 설정 기록'을 누르세요." : "아직 저장한 적이 없습니다."}</div>`; return; }
  for (const r of list) {
    const d = document.createElement("div"); d.className = "rec";
    const info = document.createElement("div"); info.innerHTML = `<div class="nm"></div><div class="tm"></div>`;
    info.querySelector(".nm").textContent = r.name || r.saved_at;
    info.querySelector(".tm").textContent = `${r.name ? r.saved_at + " · " : ""}위젯 ${r.widgets}개 · 밝기 ${r.brightness ?? "-"}`;
    const lo = document.createElement("button"); lo.textContent = "불러오기"; lo.onclick = () => loadRecord(r);
    const de = document.createElement("button"); de.textContent = "삭제"; de.className = "danger";
    de.onclick = async () => { if (!confirm(`'${r.name || r.saved_at}' 기록을 삭제할까요?`)) return;
      await fetch("/api/records/delete", { method: "POST", body: JSON.stringify({ kind: recKind, id: r.id }) }); loadRecords(); };
    d.append(info, lo, de); el.appendChild(d);
  }
}
async function loadRecord(r) {
  const j = await (await fetch("/api/records/load", { method: "POST", body: JSON.stringify({ kind: recKind, id: r.id }) })).json();
  if (j.error) { status("불러오기 실패: " + j.error); return; }
  pushHistory(); S.theme = j.theme; S.theme.widgets = S.theme.widgets || [];
  const c = j.config || {};
  if (c.brightness != null) { $("#brightness").value = c.brightness; $("#bVal").textContent = c.brightness; }
  if (c.rotate != null) $("#rotate").value = String(c.rotate);
  if (c.interval_seconds != null) $("#interval").value = c.interval_seconds;
  if (c.off_when_locked != null) $("#offLocked").checked = c.off_when_locked;
  if (c.off_when_display_off != null) $("#offDisplay").checked = c.off_when_display_off;
  sel = null; markDirty(); renderList(); renderProps(); scheduleRender(10);
  status(`'${r.name || r.saved_at}' 불러옴 — 저장을 눌러야 케이스 화면에 적용됩니다`);
}
$("#recSave").onclick = async () => {
  const name = $("#recName").value.trim();
  if (!name) { status("기록 이름을 입력하세요"); $("#recName").focus(); return; }
  const j = await (await fetch("/api/records/save", { method: "POST", body: JSON.stringify({ name, config: currentConfig(), theme: S.theme }) })).json();
  if (j.ok) { status(`'${name}' 기록됨`); $("#recName").value = ""; recKind = "presets"; loadRecords(); } else status("기록 실패: " + j.error);
};
$("#tabPresets").onclick = () => { recKind = "presets"; loadRecords(); };
$("#tabHistory").onclick = () => { recKind = "history"; loadRecords(); };

// ---------- background crop (2:1): the server crops the ORIGINAL file and downsizes with Lanczos ----------
const CROP = { img: null, file: null, scale: 1, x: 0, y: 0, w: 0, h: 0, op: null };
function openCrop(file) {
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    CROP.img = img; CROP.file = file;
    const maxW = Math.min(1060, window.innerWidth * 0.9), maxH = window.innerHeight * 0.68;
    CROP.scale = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight, 1);
    CROP.dw = Math.round(img.naturalWidth * CROP.scale); CROP.dh = Math.round(img.naturalHeight * CROP.scale);
    Object.assign($("#cropArea").style, { width: CROP.dw + "px", height: CROP.dh + "px" });
    Object.assign($("#cropImg").style, { width: CROP.dw + "px", height: CROP.dh + "px" });
    $("#cropImg").src = url; fitCrop(); $("#cropDlg").classList.add("open");
  };
  img.src = url;
}
function fitCrop() { let w = CROP.dw, h = w / 2; if (h > CROP.dh) { h = CROP.dh; w = h * 2; } CROP.w = w; CROP.h = h; CROP.x = (CROP.dw - w) / 2; CROP.y = (CROP.dh - h) / 2; drawCrop(); }
function drawCrop() {
  CROP.w = Math.max(64, Math.min(CROP.w, CROP.dw, CROP.dh * 2)); CROP.h = CROP.w / 2;
  CROP.x = Math.max(0, Math.min(CROP.x, CROP.dw - CROP.w)); CROP.y = Math.max(0, Math.min(CROP.y, CROP.dh - CROP.h));
  Object.assign($("#cropRect").style, { left: CROP.x + "px", top: CROP.y + "px", width: CROP.w + "px", height: CROP.h + "px" });
  const sw = Math.round(CROP.w / CROP.scale), sh = Math.round(CROP.h / CROP.scale);
  $("#cropInfo").textContent = `원본 ${sw}×${sh} 영역 → 960×480 (고품질 축소)` + (sw < 960 ? "  ⚠ 원본이 작아 확대되어 흐려집니다" : "") + "  · 끌기 = 이동, 모서리 = 크기, 휠 = 확대/축소";
}
$("#cropRect").addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  CROP.op = { h: e.target.dataset.h || "move", sx: e.clientX, sy: e.clientY, x: CROP.x, y: CROP.y, w: CROP.w, h0: CROP.h };
  window.addEventListener("pointermove", onCropMove);
  window.addEventListener("pointerup", () => { window.removeEventListener("pointermove", onCropMove); CROP.op = null; }, { once: true });
  e.preventDefault(); e.stopPropagation();
});
function onCropMove(e) {
  const o = CROP.op; if (!o) return;
  const dx = e.clientX - o.sx, dy = e.clientY - o.sy;
  if (o.h === "move") { CROP.x = o.x + dx; CROP.y = o.y + dy; }
  else {
    const sx = o.h.includes("e") ? 1 : -1, sy = o.h.includes("s") ? 1 : -1;
    const right = o.x + o.w, bottom = o.y + o.h0;
    let nw = Math.max(64, o.w + Math.max(sx * dx, sy * dy * 2));
    const maxW = Math.min(sx > 0 ? CROP.dw - o.x : right, 2 * (sy > 0 ? CROP.dh - o.y : bottom)); nw = Math.min(nw, maxW);
    CROP.w = nw; CROP.h = nw / 2; CROP.x = sx > 0 ? o.x : right - nw; CROP.y = sy > 0 ? o.y : bottom - nw / 2;
  }
  drawCrop();
}
$("#cropArea").addEventListener("wheel", (e) => {
  e.preventDefault(); const cx = CROP.x + CROP.w / 2, cy = CROP.y + CROP.h / 2;
  CROP.w *= e.deltaY > 0 ? 1.06 : 1 / 1.06; CROP.h = CROP.w / 2; CROP.x = cx - CROP.w / 2; CROP.y = cy - CROP.h / 2; drawCrop();
}, { passive: false });
$("#cropFit").onclick = fitCrop;
$("#cropCancel").onclick = () => $("#cropDlg").classList.remove("open");
$("#cropApply").onclick = async () => {
  const s = CROP.scale;
  const q = new URLSearchParams({ name: CROP.file.name, x: (CROP.x / s).toFixed(1), y: (CROP.y / s).toFixed(1), w: (CROP.w / s).toFixed(1), h: (CROP.h / s).toFixed(1) });
  $("#cropDlg").classList.remove("open"); status("배경 업로드 중… (원본에서 고품질로 자르는 중)");
  const r = await fetch("/api/background?" + q, { method: "POST", body: CROP.file });
  const j = await r.json();
  if (j.path) { pushHistory(); S.theme.background = { path: j.path }; markDirty(); scheduleRender(10); status("배경 적용됨 — 저장을 눌러야 케이스 화면에 반영됩니다"); }
  else status("업로드 실패: " + j.error);
};

// ---------- events ----------
document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => newWidget(b.dataset.add));
$("#undo").onclick = undo; $("#redo").onclick = redo; $("#save").onclick = save;
$("#reload").onclick = () => { if (!dirty || confirm("저장하지 않은 변경을 버릴까요?")) load(); };
$("#brightness").oninput = () => { $("#bVal").textContent = $("#brightness").value; markDirty(); };
["#rotate", "#interval", "#offLocked", "#offDisplay"].forEach(s => $(s).onchange = markDirty);
$("#fileBg").onchange = (e) => { const f = e.target.files[0]; if (f) openCrop(f); e.target.value = ""; };
document.addEventListener("keydown", (e) => {
  if ($("#cropDlg").classList.contains("open")) { if (e.key === "Escape") $("#cropDlg").classList.remove("open"); return; }
  const ae = document.activeElement, typing = ["INPUT", "SELECT", "TEXTAREA"].includes(ae.tagName) && !["range", "checkbox", "color"].includes(ae.type);
  if ((e.ctrlKey || e.metaKey) && !typing) {
    const k = e.key.toLowerCase();
    if (k === "z" && !e.shiftKey) { undo(); e.preventDefault(); return; }
    if (k === "y" || (k === "z" && e.shiftKey)) { redo(); e.preventDefault(); return; }
  }
  if (!sel || typing) return;
  const w = byId(sel); if (!w) return; const step = e.shiftKey ? 10 : 1;
  const mv = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
  if (mv) { beginEdit(sel + ":nudge"); w.x = (+w.x || 0) + mv[0]; w.y = (+w.y || 0) + mv[1]; markDirty(); renderProps(); scheduleRender(60); e.preventDefault(); }
  if (e.key === "Delete") { removeSel(); e.preventDefault(); }
});
window.addEventListener("resize", () => { if (!drag) drawBoxes(); });
window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
setInterval(() => { if (!drag && S && !document.hidden && !$("#cropDlg").classList.contains("open")) scheduleRender(0); }, 3000);
load();
</script>
</body>
